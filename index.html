/* --- PREMIUM SIM CARD STYLE --- */
.premium-card {
background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
border: 1px solid var(--line);
border-left: 5px solid var(--gold);
border-radius: 18px;
padding: 20px;
margin-bottom: 20px;
position: relative;
box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
.info-row {
display: flex;
justify-content: space-between;
align-items: center;
padding: 10px 0;
border-bottom: 1px solid rgba(255,255,255,0.05);
}
.info-row:last-of-type { border: 0; }
.info-label {
color: var(--gold);
font-weight: 700;
font-size: 0.75rem;
text-transform: uppercase;
letter-spacing: 1px;
}
.info-value {
color: var(--fg);
font-weight: 500;
font-size: 0.95rem;
}
.card-footer {
margin-top: 15px;
text-align: center;
font-size: 0.7rem;
color: var(--mut);
font-weight: 700;
letter-spacing: 0.5px;
border-top: 1px solid var(--line);
padding-top: 10px;
}
.card-actions {
display: flex;
gap: 10px;
margin-top: 15px;
justify-content: center;
}
.action-btn {
padding: 8px 15px;
border-radius: 10px;
font-size: 0.8rem;
font-weight: 700;
cursor: pointer;
border: 1px solid var(--line);
background: var(--card);
color: var(--fg);
transition: all 0.2s;
display: flex;
align-items: center;
gap: 5px;
}
.action-btn:hover {
background: var(--gold);
color: var(--ink);
}
